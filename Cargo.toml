[package]
name = "birdnet-rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of birdnet-go: realtime bird-sound analyzer (Leptos fullstack + ONNX/BirdNET)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Leptos (both server + client) ---
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }

# --- Serialization / time (server fns + DTOs, both targets) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# --- Client (hydrate / WASM) ---
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document", "Window", "Element",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "EventSource", "MessageEvent", "Event", "EventTarget",
] }

# --- Server (ssr) only: web, db, audio, inference, dsp ---
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["fs", "trace", "cors"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "process", "io-util"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
futures = { version = "0.3", optional = true }

birdnet-onnx = { version = "=2.0.0-rc.15", optional = true }
cpal = { version = "0.15", optional = true }
rubato = { version = "0.16", optional = true }
hound = { version = "3.5", optional = true }
rustfft = { version = "6", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

sea-orm = { version = "1.1", optional = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1.1", optional = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

serde_yaml = { version = "0.9", optional = true }
dirs = { version = "5", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

# --- Integrations (ssr only): HTTP, MQTT ---
# BirdWeather soundscape FLAC + EBU R128 loudness normalization is done by
# shelling out to `ffmpeg` (matching birdnet-go), which avoids a libFLAC link dep.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
rumqttc = { version = "0.24", optional = true, features = ["use-rustls"] }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:birdnet-onnx",
    "dep:cpal",
    "dep:rubato",
    "dep:hound",
    "dep:rustfft",
    "dep:image",
    "dep:sea-orm",
    "dep:sea-orm-migration",
    "dep:serde_yaml",
    "dep:dirs",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:anyhow",
    "dep:async-trait",
    "dep:reqwest",
    "dep:rumqttc",
]

# On Linux we capture via ALSA directly (cpal only exposes the high-level PCM
# plugins, not individual PipeWire/Pulse sources or hardware cards). Native-only;
# `cfg(target_os="linux")` is false for the wasm32 hydrate build.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Size-optimized WASM bundle (used by cargo-leptos for the lib release build).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "birdnet-rs"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "0.0.0.0:8080"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
